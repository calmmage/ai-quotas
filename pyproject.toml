[project]
name = "ai-quotas"
version = "0.2.0"
description = "Local subscription quota sampler and dash for Claude, Codex, Grok, and Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Petr Lavrov" }]
keywords = ["quota", "claude", "codex", "grok", "gemini", "openrouter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
# Runtime: stdlib only. No third-party runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = [
  "pandas>=2.0",
  "plotly>=5.18",
]
# Convenience: tests + plot stack
all = [
  "pytest>=8.0",
  "pandas>=2.0",
  "plotly>=5.18",
]

[project.scripts]
ai-quotas = "ai_quotas.cli:main"

[project.urls]
Homepage = "https://github.com/calmmage/ai-quotas"
Repository = "https://github.com/calmmage/ai-quotas"
Issues = "https://github.com/calmmage/ai-quotas/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_quotas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
