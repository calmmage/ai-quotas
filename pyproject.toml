[project]
name = "ai-quotas"
version = "0.1.0"
description = "Standalone subscription quota sampler, trend math, and human CLI for AI vendor CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Petr Lavrov" }]
keywords = ["quota", "claude", "codex", "grok", "openrouter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
# Runtime: stdlib only. No third-party runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = [
  "pandas>=2.0",
  "matplotlib>=3.8",
  "plotly>=5.18",
]
# Convenience: tests + plot stack
all = [
  "pytest>=8.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "plotly>=5.18",
]

[project.scripts]
ai-quotas = "ai_quotas.cli:main"

# Remote / homepage omitted until publication gate (owner + visibility) is decided.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_quotas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
