<script>

function fmtTok(n) {
  if (n == null || !(n > 0)) return '';
  if (n >= 1e6) return `~${(n/1e6).toFixed(1)}M tok`;
  if (n >= 1e3) return `~${(n/1e3).toFixed(0)}k tok`;
  return `~${Math.round(n)} tok`;
}
function hoverExtra(s, y, t) {
  if (y == null) return '';
  const bits = [];
  const index = s.t.indexOf(t);
  const usd = s.point_usd ? s.point_usd[index] : s.window_usd;
  if (usd) bits.push(`~$${ (y/100*usd).toFixed(0) }`);
  if (s.tokens_per_pct) bits.push(fmtTok(y * s.tokens_per_pct));
  return bits.length ? ' · ' + bits.join(' · ') : '';
}
function parseHex(hex) {
  const h = (hex || '#888').replace('#','');
  const full = h.length === 3 ? h.split('').map(c => c+c).join('') : h;
  const n = parseInt(full, 16);
  if (!Number.isFinite(n)) return [136, 136, 136];
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function isDim(s) {
  return !!(s && (s.dim || /5h/i.test(s.label || '')));
}
function mixHex(fg, bg, t) {
  // t = fraction of the series color; rest is background.
  const [r,g,b] = parseHex(fg);
  const [br,bgc,bb] = parseHex(bg);
  const m = (a, b) => Math.round(a*t + b*(1-t));
  return `rgb(${m(r,br)},${m(g,bgc)},${m(b,bb)})`;
}
function spendStrip(panel) {
  const rows = panel.spend || [];
  if (!rows.some(d => d.tokens)) return '';
  const max = Math.max(...rows.map(d => d.tokens || 0), 1);
  const bars = rows.map(d => {
    const h = 3 + 22 * ((d.tokens || 0) / max);
    const usd = d.cost_usd != null ? ` · $${Number(d.cost_usd).toFixed(2)}` : '';
    const title = `${d.day}: ${(d.tokens||0).toLocaleString()} tok${usd}`;
    return `<span title="${title}"><i style="height:${h}px"></i></span>`;
  }).join('');
  return `<div class="spend-strip">${bars}<em>daily tok</em></div>`;
}
function fmtWhen(t) {
  const d = new Date(t * 1000);
  const dd = String(d.getDate()).padStart(2,'0');
  const mon = d.toLocaleString(undefined, { month: 'short' });
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${dd} ${mon} ${hh}:${mm}`;
}
function esc(s) {
  return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
const VENDORS = __VENDORS__;
const SHELL_VERSION = '__SHELL_VERSION__';
const DATA_URL = '../__PANELS_NAME__';
const META_URL = '../meta.json';
const BURN_W = __BURN_W__;
const BURN_A = __BURN_A__;
const grid = document.getElementById('grid');
const charts = []; // {u, wrap, section, head, legend, strip, panel, sig, headSig}
let spanDays = Number(localStorage.getItem('quota-uplot-span') || 0);

// latest timestamp across every series, so all panels share one window
let LAST_T = 0, FIRST_T = Infinity;
function setBounds(panels) {
  LAST_T = Math.max(0, ...panels.flatMap(p => p.series.map(s => s.t[s.t.length-1] || 0)));
  FIRST_T = Math.min(...panels.flatMap(p => p.series.filter(s => s.t.length).map(s => s.t[0])));
}
function viewMinMax() {
  if (!LAST_T || !isFinite(FIRST_T)) return [0, 1];
  const start = spanDays ? Math.max(FIRST_T, LAST_T - spanDays * 86400) : FIRST_T;
  return [start, Math.max(LAST_T, Date.now() / 1000) + 86400];
}
let customRange = null;
let applyingSpan = false;
function axisMinMax() {
  if (customRange && customRange.length === 2 && customRange[1] > customRange[0]) return customRange;
  return viewMinMax();
}
function visibleDays() {
  const [a, b] = axisMinMax();
  return (b - a) / 86400;
}
function markSpanCustom() {
  document.querySelectorAll('.controls button[data-span]').forEach(o => o.classList.remove('active'));
}
function markSpanSnap() {
  document.querySelectorAll('.controls button[data-span]').forEach(o =>
    o.classList.toggle('active', Number(o.dataset.span) === spanDays));
}
function declutterChart(c) {
  if (!c.u) return;
  const hideSession = visibleDays() > 10;
  c.panel.series.forEach((s, i) => {
    const want = !(hideSession && isDim(s));
    if (c.u.series[i + 1] && c.u.series[i + 1].show !== want) {
      c.u.setSeries(i + 1, { show: want }, false);
    }
  });
}
function applySpan() {
  const [a, b] = axisMinMax();
  applyingSpan = true;
  charts.forEach(c => {
    if (!c.panel) return;
    updateQuotaHeader(c.section, c.panel, [a, b]);
    if (!c.u || !isFinite(a) || !isFinite(b) || b <= a) return;
    c.u.setScale('x', { min: a, max: b });
    declutterChart(c);
  });
  applyingSpan = false;
}

// Draw hooks read chart.panel at draw time, so a data refresh only has to swap
// the panel object and call setData — the chart is never rebuilt.
function makeDraws(chart) {
  const hits = [];
  const resetsOf = p => p.resets.map(r => ({
    t: r.t, line_color: r.line_color,
    edge: r.edge_dark || r.edge, face: r.face_dark || r.face,
    pill: r.pill || r.label,
    tooltip: r.tooltip || r.pill || r.label,
  }));
  function drawGrid(u){
    const ctx=u.ctx, {left,top,width,height}=u.bbox;
    const vline=(t,color,lw)=>{ const x=u.valToPos(t,'x',true); if (x<left||x>left+width) return;
      ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,top+height); ctx.stroke(); };
    const hline=(v,color,lw)=>{ const y=u.valToPos(v,'y',true);
      ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(left+width,y); ctx.stroke(); };
    ctx.save();
    for (let v=5; v<100; v+=5) { if (v%20===0) continue; hline(v, '#242832', 0.5); }
    for (let v=0; v<=100; v+=20) { hline(v, '#343a46', 0.8); }
    const [xmin,xmax]=[u.scales.x.min, u.scales.x.max];
    const axis=timeAxis(xmin, xmax, u.width);
    axis.minors.forEach(t => vline(t, '#242832', 0.5));
    axis.majors.forEach(t => vline(t, '#565f70', 1.4));
    ctx.restore();
  }
  function drawBurnTicks(u){
    const burnTicks = chart.panel.burn_ticks;
    const ctx=u.ctx, {left,top,width,height}=u.bbox;
    const DPR=u.pxRatio||window.devicePixelRatio||1;
    ctx.save(); ctx.beginPath(); ctx.rect(left,top,width,height); ctx.clip();
    const y0=u.valToPos(0,'y',true);
    ctx.lineWidth=BURN_W*DPR; ctx.globalAlpha=BURN_A;
    const minPx = visibleDays() > 20 ? 6 : 3;
    burnTicks.forEach(s => {
      ctx.strokeStyle=s.color;
      let lastX = -1e9;
      s.pts.forEach(([t,yTop]) => {
        const x=u.valToPos(t,'x',true);
        if (x<left||x>left+width) return;
        if (x - lastX < minPx) return;
        lastX = x;
        const y1=u.valToPos(yTop,'y',true);
        ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();
      });
    });
    ctx.globalAlpha=1; ctx.restore();
  }
  // Budget guide to the provider-reported scheduled reset
  function drawBudget(u){
    const budget = chart.panel.budget;
    const ctx=u.ctx, {left,top,width,height}=u.bbox;
    const DPR=u.pxRatio||window.devicePixelRatio||1;
    ctx.save();
    ctx.beginPath(); ctx.rect(left,top,width,height); ctx.clip();
    ctx.strokeStyle='#7c838f'; ctx.lineWidth=1.4*DPR;
    ctx.setLineDash([7*DPR,5*DPR]);
    budget.forEach(b => {
      b.segs.forEach(seg => {
        if (seg.length < 2) return;
        ctx.beginPath();
        seg.forEach(([t,y], i) => {
          const px=u.valToPos(t,'x',true), py=u.valToPos(y,'y',true);
          if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        });
        ctx.stroke();
      });
    });
    ctx.setLineDash([]);
    ctx.restore();
  }
  function drawResets(u){
    const resets = resetsOf(chart.panel);
    const ctx=u.ctx, {left,top,width,height}=u.bbox, yb=top+height;
    // canvas hooks work in device pixels — scale every hardcoded px or the
    // labels render at half size on retina
    const DPR=u.pxRatio||window.devicePixelRatio||1;
    hits.length = 0;
    const days = visibleDays();
    let shown = resets;
    if (days > 12) {
      const money = resets.filter(r => /\$/.test(String(r.pill || '') + String(r.tooltip || '')));
      shown = (money.length ? money : resets).slice(-8);
    }
    shown.forEach((r,idx) => {
      const x=u.valToPos(r.t,'x',true);
      if (x < left || x > left+width) return;
      ctx.save();
      ctx.beginPath(); ctx.rect(left,top,width,height); ctx.clip();
      ctx.strokeStyle=r.line_color; ctx.setLineDash([5*DPR,4*DPR]); ctx.lineWidth=1.6*DPR; ctx.globalAlpha=0.95;
      ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,yb); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
      ctx.font=`600 ${Math.round(11*DPR)}px system-ui`;
      const padX=7*DPR, padY=3*DPR, rowH=22*DPR, boxH=14*DPR+padY*2;
      const boxW=ctx.measureText(r.pill).width+padX*2;
      const boxTop=yb-6*DPR-(idx%3)*rowH-boxH;
      // flip the box to the left of the marker rather than let it run off
      let bx=x+4*DPR;
      if (bx+boxW > left+width) bx=x-4*DPR-boxW;
      const radius=7*DPR;
      ctx.fillStyle=r.face; ctx.strokeStyle=r.edge; ctx.lineWidth=1*DPR;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, boxTop, boxW, boxH, radius);
      else ctx.rect(bx, boxTop, boxW, boxH);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle=r.edge; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(r.pill, bx+padX, boxTop+boxH/2);
      ctx.restore();
      // bbox is canvas px; cursor.left/top are CSS px relative to the plot.
      // Hitting bx/DPR without subtracting left/top shifted the box into the
      // y-axis, so only the 8px line fallback fired (Petr: cover the green text).
      const pad = 6;
      hits.push({
        t: r.t, pill: r.pill, tooltip: r.tooltip,
        x0: (bx - left) / DPR - pad,
        y0: (boxTop - top) / DPR - pad,
        x1: (bx + boxW - left) / DPR + pad,
        y1: (boxTop + boxH - top) / DPR + pad,
      });
    });
  }
  return { drawGrid, drawBurnTicks, drawBudget, drawResets, hits };
}

function alignData(seriesData) {
  const tset = new Set();
  seriesData.forEach(s => s.t.forEach(t => tset.add(t)));
  const xs = Array.from(tset).sort((a,b)=>a-b);
  // uPlot: null = line break, undefined = connect through. Missing timestamps
  // of *this* series (another window sampled then) must not break the line.
  // Explicit nulls in s.y are the Python >12h sampling holes.
  const align = s => {
    const m = new Map(s.t.map((t, i) => [t, s.y[i]]));
    return xs.map(t => m.has(t) ? m.get(t) : undefined);
  };
  return [xs, ...seriesData.map(align)];
}

function currentCols() {
  return Number(getComputedStyle(document.documentElement).getPropertyValue('--cols')) || 2;
}

function panelSize(cols) {
  // Prefer measured panel chart width (full cell) over math that can lag CSS
  const sample = grid.querySelector('.chart');
  let cellW;
  if (sample && sample.clientWidth > 40) {
    cellW = sample.clientWidth;
  } else {
    const w = grid.clientWidth || window.innerWidth;
    const gap = 12, pad = 28;
    cellW = Math.max(240, (w - pad - (cols - 1) * gap) / cols);
  }
  let h;
  if (cols === 1) h = Math.min(520, Math.max(360, cellW * 0.32));
  else if (cols === 2) h = Math.min(380, Math.max(260, cellW * 0.48));
  else if (cols === 3) h = Math.min(300, Math.max(220, cellW * 0.55));
  else h = Math.min(250, Math.max(180, cellW * 0.62));
  return { width: Math.floor(cellW), height: Math.floor(h) };
}

function makePlot(chart, width, height) {
  const wrap = chart.wrap;
  const data = alignData(chart.panel.series);
  const draws = makeDraws(chart);
  const opts = {
    width, height,
    // NB: cursor.points.show:true throws inside uPlot 1.6.31 — leave the
    // default (a factory fn) alone; points still render.
    cursor: { show: true, drag: { x: true, y: false } },
    legend: { show: false },
    series: [{}, ...chart.panel.series.map(s => ({
      label: s.label,
      // mix into the panel bg — rgba on a bright gold still reads loud on dark canvas
      stroke: isDim(s) ? mixHex(s.color, '#151821', 0.22) : s.color,
      width: isDim(s) ? 1.0 : 2.3,
      spanGaps: false,
      show: !(isDim(s) && visibleDays() > 10),
    }))],
    axes: [
      { stroke:'#8a8f98', grid:{show:false},
        splits:(u,axisIdx,min,max)=>timeAxis(min,max,u.width).majors,
        values:(u,vals)=>{ const axis=timeAxis(u.scales.x.min, u.scales.x.max, u.width); return vals.map(v=>axis.fmt(v)); } },
      { stroke:'#8a8f98', grid:{show:false}, label:'% remaining',
        splits:(u,axisIdx,min,max)=>[0,20,40,60,80,100] },
    ],
    scales: { y: { range: [-2, 102] } },
    hooks: {
      drawClear: [draws.drawGrid, draws.drawBurnTicks, draws.drawBudget],
      draw: [draws.drawResets],
      setScale: [(u, key) => {
        if (key !== 'x' || applyingSpan) return;
        const min = u.scales.x.min, max = u.scales.x.max;
        if (!isFinite(min) || !isFinite(max) || max <= min) return;
        customRange = [min, max];
        markSpanCustom();
        const c = charts.find(ch => ch.u === u);
        if (c) declutterChart(c);
      }],
      setCursor: [(u) => {
        const seriesData = chart.panel.series;
        let tip = wrap.querySelector('.quota-tip');
        if (!tip) {
          tip = document.createElement('div');
          tip.className = 'quota-tip';
          wrap.appendChild(tip);
        }
        const idx = u.cursor.idx;
        const cl = u.cursor.left;
        const ct = u.cursor.top;
        let hit = null;
        if (cl != null && ct != null) {
          for (const h of draws.hits) {
            if (cl >= h.x0 && cl <= h.x1 && ct >= h.y0 && ct <= h.y1) { hit = h; break; }
          }
          if (!hit) {
            for (const h of draws.hits) {
              const rx = u.valToPos(h.t, 'x', false);
              const inY = ct >= h.y0 && ct <= h.y1;
              if (inY && Math.abs(cl - rx) <= 14) { hit = h; break; }
            }
          }
        }
        if ((idx == null || idx < 0) && !hit) {
          tip.style.display = 'none';
          return;
        }
        const t = hit ? hit.t : u.data[0][idx];
        const rows = [];
        if (hit) {
          rows.push(`<div class="mark"><b>${esc(hit.pill)}</b> · ${esc(hit.tooltip)}</div>`);
        }
        if (idx != null && idx >= 0) {
          for (let i = 0; i < seriesData.length; i++) {
            const y = u.data[i + 1][idx];
            if (y == null) continue;
            const s = seriesData[i];
            const dim = isDim(s) ? ' dim' : '';
            rows.push(
              `<div class="row${dim}"><i style="background:${s.color}"></i>` +
              `${s.label} ${Number(y).toFixed(1)}%${hoverExtra(s, y, t)}</div>`
            );
          }
        }
        if (!rows.length) {
          tip.style.display = 'none';
          return;
        }
        tip.innerHTML = `<div class="t">${fmtWhen(t)}</div>${rows.join('')}`;
        tip.style.display = 'block';
        const left = u.cursor.left || 0;
        const top = u.cursor.top || 0;
        const tw = tip.offsetWidth || 160;
        const th = tip.offsetHeight || 40;
        const maxL = (wrap.clientWidth || u.width) - tw - 8;
        const maxT = (wrap.clientHeight || u.height) - th - 8;
        tip.style.left = Math.max(8, Math.min(left + 14, maxL)) + 'px';
        tip.style.top = Math.max(8, Math.min(top + 14, maxT)) + 'px';
      }],
    },
  };
  const u = new uPlot(opts, data, wrap);
  wrap.addEventListener('wheel', (e) => {
    if (!u.scales.x) return;
    e.preventDefault();
    const { min, max } = u.scales.x;
    if (!isFinite(min) || !isFinite(max) || max <= min) return;
    const rect = wrap.getBoundingClientRect();
    const left = u.bbox.left / (u.pxRatio || 1);
    const width = u.bbox.width / (u.pxRatio || 1);
    const frac = Math.min(1, Math.max(0, (e.clientX - rect.left - left) / width));
    const cursorT = min + frac * (max - min);
    const factor = e.deltaY > 0 ? 1.25 : 0.8;
    let nmin = cursorT - (cursorT - min) * factor;
    let nmax = cursorT + (max - cursorT) * factor;
    const floor = FIRST_T, ceil = Math.max(LAST_T, Date.now() / 1000) + 86400;
    if (nmin < floor) { nmax += floor - nmin; nmin = floor; }
    if (nmax > ceil) { nmin -= nmax - ceil; nmax = ceil; }
    nmin = Math.max(floor, nmin);
    customRange = [nmin, nmax];
    markSpanCustom();
    u.setScale('x', { min: nmin, max: nmax });
  }, { passive: false });
  wrap.addEventListener('dblclick', () => {
    customRange = null;
    markSpanSnap();
    applySpan();
  });
  return u;
}

// Wait for grid reflow so each .chart is full width at cols=1. rAF alone is
// not enough: it never fires while the tab is in the background, which would
// leave every panel unsized until the tab is focused.
function afterReflow(fn) {
  let done = false;
  const run = () => { if (!done) { done = true; fn(); } };
  requestAnimationFrame(() => requestAnimationFrame(run));
  setTimeout(run, 120);
}

function setCols(cols) {
  document.documentElement.style.setProperty('--cols', String(cols));
  document.querySelectorAll('.controls button[data-cols]').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.cols) === cols);
  });
  localStorage.setItem('quota-uplot-cols', String(cols));
  afterReflow(() => {
    const h = panelSize(currentCols()).height;
    charts.forEach(c => {
      // measure THIS chart's container (handles full-width 1-col correctly)
      if (c.u) c.u.setSize({ width: Math.max(200, c.wrap.clientWidth), height: h });
      else c.wrap.style.minHeight = (h + 8) + 'px';
    });
  });
}

// Skeleton panel painted before any data arrives: vendor name + reserved
// chart height, so the real chart lands without a layout jump.
function createPanel(vendor, i) {
  const section = document.createElement('section');
  section.className = 'panel loading';
  section.style.setProperty('--i', String(i));
  const head = document.createElement('div');
  head.className = 'phead';
  head.innerHTML = `<div class="value-summary"><h2>${esc(vendor)}</h2><p class="value-line">&nbsp;</p><p class="period-line">&nbsp;</p></div>`;
  const legend = document.createElement('div');
  legend.className = 'legend';
  const wrap = document.createElement('div');
  wrap.className = 'chart';
  wrap.style.minHeight = (panelSize(currentCols()).height + 8) + 'px';
  section.append(head, legend, wrap);
  grid.appendChild(section);
  return { u: null, wrap, section, head, legend, strip: null, panel: null, sig: '', headSig: '' };
}

function fillPanel(c, p) {
  c.panel = p;
  // header markup only changes when the subscription state does; keeping it
  // preserves an open <details> across refreshes
  const headSig = [p.vendor, p.subscription.provider, p.subscription.monthly_usd == null, p.subscription.basis].join('|');
  if (c.headSig !== headSig) { c.head.innerHTML = quotaHeader(p); c.headSig = headSig; }
  const legendHtml = p.series.map(s =>
    `<span${isDim(s) ? ' class="dim"' : ''}><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('') +
    p.budget.map(b =>
    `<span><i style="background:repeating-linear-gradient(90deg,#7c838f 0 4px,transparent 4px 7px)"></i>${esc(b.label)}</span>`).join('');
  if (c.legend.innerHTML !== legendHtml) c.legend.innerHTML = legendHtml;
  const stripHtml = spendStrip(p);
  if (c.strip) { c.strip.remove(); c.strip = null; }
  if (stripHtml) {
    const holder = document.createElement('div');
    holder.innerHTML = stripHtml;
    c.strip = holder.firstElementChild;
    c.section.insertBefore(c.strip, c.wrap);
  }
  const sig = p.series.map(s => `${s.label}|${s.color}|${isDim(s)}`).join(',');
  if (c.u && c.sig !== sig) { c.u.destroy(); c.u = null; }
  c.sig = sig;
  if (c.u) c.u.setData(alignData(p.series), false);
}

function fmtClock(sec) {
  const d = new Date(sec * 1000);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function markUpdated(data) {
  const el = document.getElementById('live');
  const sampled = Math.max(0, ...data.panels.map(p => p.sampled_at || 0));
  el.hidden = false;
  el.classList.remove('error');
  el.lastElementChild.textContent = sampled ? `live · data ${fmtClock(sampled)}` : 'live';
  if (el.dataset.ready) { el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); }
  else if (window.performance && performance.mark) performance.mark('quota-charts-ready'); // first paint with charts
  el.dataset.ready = '1';
}
function showError(msg) {
  const el = document.getElementById('live');
  el.hidden = false;
  el.classList.add('error');
  el.lastElementChild.textContent = msg;
}
function setCutoff(cutoff) {
  const info = document.querySelector('header .info');
  if (info && cutoff) info.title = `${info.dataset.title} · cutoff ${cutoff}`;
}

function render(data) {
  if (typeof uPlot === 'undefined') { showError('chart library did not load'); return; }
  setBounds(data.panels);
  setCutoff(data.cutoff);
  data.panels.forEach((p, i) => {
    if (!charts[i]) charts[i] = createPanel(p.vendor, i);
    fillPanel(charts[i], p);
  });
  applySpan(); // existing charts: new data + range in one paint
  afterReflow(() => {
    const cols = currentCols();
    const { height } = panelSize(cols);
    // measure each wrap itself — a shared estimate overshoots before the CSS
    // grid has settled, leaving the canvas wider than its panel (clipped)
    charts.forEach(c => {
      if (!c.panel || c.u) return;
      const w = Math.max(200, c.wrap.clientWidth || panelSize(cols).width);
      c.u = makePlot(c, w, height);
      c.wrap.style.minHeight = '';
      c.section.classList.remove('loading');
    });
    applySpan();
    markUpdated(data);
  });
}

function boot() {
  const saved = Number(localStorage.getItem('quota-uplot-cols') || 2);
  const cols = [1,2,3,4].includes(saved) ? saved : 2;
  document.documentElement.style.setProperty('--cols', String(cols));
  VENDORS.forEach((v, i) => { charts[i] = createPanel(v, i); });
  document.querySelectorAll('.controls button[data-cols]').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.cols) === cols);
    b.addEventListener('click', () => setCols(Number(b.dataset.cols)));
  });
  document.querySelectorAll('.controls button[data-span]').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.span) === spanDays);
    b.addEventListener('click', () => {
      spanDays = Number(b.dataset.span);
      customRange = null;
      localStorage.setItem('quota-uplot-span', String(spanDays));
      markSpanSnap();
      applySpan();
    });
  });
  let t = null;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => setCols(currentCols()), 120);
  });
  // uPlot is a deferred script: defined by DOMContentLoaded, after this inline
  // script has already painted the skeleton.
  const libReady = new Promise(resolve => {
    if (document.readyState !== 'loading') resolve();
    else document.addEventListener('DOMContentLoaded', () => resolve(), { once: true });
  });
  const poller = createLivePoller({
    fetchImpl: (url, init) => fetch(url, init),
    metaUrl: META_URL, dataUrl: DATA_URL, shellVersion: SHELL_VERSION,
    onData: data => { libReady.then(() => render(data)); },
    onOutdated: () => location.reload(),
    isBusy: () => !!document.querySelector('dialog[open]') || !!window.quotaSettingsPending,
    hidden: () => document.hidden,
  });
  window.quotaRefresh = () => poller.refresh();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poller.wake(); });
  poller.start().catch(err => showError(`data unavailable · ${err && err.message || err}`));
}
boot();
</script></body></html>
