<script>
__THEME_JS__
__PANEL_HEADER_JS__

function isDim(s) {
  return !!(s && (s.dim || /5h/i.test(s.label || '')));
}
function fmtTok(n) {
  if (n == null || !(n > 0)) return '';
  if (n >= 1e6) return `~${(n/1e6).toFixed(1)}M tok`;
  if (n >= 1e3) return `~${(n/1e3).toFixed(0)}k tok`;
  return `~${Math.round(n)} tok`;
}
function hoverExtra(s, y, index) {
  if (y == null) return '';
  const bits = [];
  const usd = s.point_usd ? s.point_usd[index] : s.window_usd;
  if (usd) bits.push(`estimated value $${(y/100*usd).toFixed(0)}`);
  if (s.tokens_per_pct) bits.push(fmtTok(y * s.tokens_per_pct));
  return bits.join(' · ');
}
function esc(s) {
  return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
const VENDORS = __VENDORS__;
const SHELL_VERSION = '__SHELL_VERSION__';
const DATA_URL = '../__PANELS_NAME__';
const META_URL = '../meta.json';
const BURN_W = __BURN_W__;
const BURN_A = __BURN_A__;
const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const rangeEl = document.getElementById('range-nav');
const plots = []; // {div, section, head, strip, panel, headSig, vendor}
const range = createRangeController();
const layout = createQuotaLayout('plotly', () => setCols(null, false));
let rangeNav = null;
let applyingLayout = false;
function axisMinMax() { return range.axisMinMax(); }
function visibleDays() { return range.visibleDays(); }
function xRange() {
  const [a, b] = axisMinMax();
  if (!isFinite(a) || !isFinite(b) || b <= a) return null;
  return [new Date(a * 1000), new Date(b * 1000)];
}

function currentCols() {
  return Number(getComputedStyle(document.documentElement).getPropertyValue('--cols')) || 2;
}

function autoPanelHeight(cols) {
  const w = grid.clientWidth || window.innerWidth;
  const cell = Math.max(280, (w - 28 - (cols - 1) * 12) / cols);
  // taller when full-width (1 col)
  if (cols === 1) return Math.min(560, Math.max(380, cell * 0.32));
  if (cols === 2) return Math.min(420, Math.max(280, cell * 0.48));
  if (cols === 3) return Math.min(340, Math.max(240, cell * 0.55));
  return Math.min(280, Math.max(200, cell * 0.62));
}

function panelHeight(cols) { return layout.height(autoPanelHeight(cols)); }

function buildFigure(p, width, height) {
  const days = visibleDays();
  const tokenDays = layout.tokens() === 'background' ? quotaTokenDays(p, ...axisMinMax()) : [];
  const tokenMax = Math.max(1, ...tokenDays.map(d => d.tokens || 0));
  const traces = p.series.filter(s => !(isDim(s) && days > 10)).map(s => ({
    x: s.t.map(t => new Date(t * 1000)),
    y: s.y,
    mode: 'lines',
    name: s.label,
    opacity: isDim(s) ? 0.22 : 1,
    line: { color: s.color, width: isDim(s) ? 1.0 : 2.4 },
    connectgaps: false,
    text: s.y.map((y,i) => hoverExtra(s, y, i)),
    hovertemplate: `<b>${s.label}</b><br>%{x}<br>remaining %{y:.1f}%<br>%{text}<extra></extra>`,
  }));
  // Budget guide reaches zero at the provider-reported scheduled reset.
  p.budget.forEach(b => {
    b.segs.forEach((seg, i) => {
      traces.push({
        x: seg.map(pt => new Date(pt[0] * 1000)),
        y: seg.map(pt => pt[1]),
        mode: 'lines',
        name: b.label === 'Budget to scheduled reset' ? 'Budget' : b.label,
        showlegend: i === 0,
        legendgroup: 'budget',
        line: { color: '#8a8a8a', width: 1.4, dash: 'longdash' },
        hovertemplate: `<b>${b.label}</b><br>%{y:.1f}%<extra></extra>`,
      });
    });
  });
  (p.inferred || []).forEach(b => {
    b.segs.forEach((seg, i) => {
      traces.push({
        x: seg.map(pt => new Date(pt[0] * 1000)),
        y: seg.map(pt => pt[1]),
        mode: 'lines',
        name: b.label === 'Budget to scheduled reset' ? 'Budget' : b.label,
        showlegend: i === 0,
        legendgroup: 'inferred',
        line: { color: b.color || '#8a8a8a', width: 1.4, dash: 'dot' },
        hovertemplate: `<b>${b.label}</b><br>%{y:.1f}% · not measured<extra></extra>`,
      });
    });
  });
  const [vmin, vmax] = axisMinMax();
  const axis = timeAxis(vmin, vmax, width);
  const shapes = [];
  const annotations = [];
  const minPx = days > 20 ? 6 : 3;
  const px = t => (vmax === vmin) ? 0 : (t - vmin) / (vmax - vmin) * width;
  (p.inferred || []).forEach(b => (b.segs || []).forEach(seg => {
    if (!seg.length) return;
    const x = new Date(seg[0][0] * 1000);
    shapes.push({
      type: 'line', x0: x, x1: x, y0: 0, y1: 1, yref: 'paper',
      line: { color: b.color || '#8a8a8a', width: 1.2, dash: 'dot' },
      layer: 'below',
    });
  }));
  axis.minors.forEach(t => {
    shapes.push({
      type: 'line',
      x0: new Date(t * 1000), x1: new Date(t * 1000),
      y0: 0, y1: 1, yref: 'paper',
      line: { color: '#E8E8E2', width: 0.5 },
      layer: 'below',
    });
  });
  p.burn_ticks.forEach(s => {
    let lastX = -1e9;
    s.pts.forEach(([t, yTop]) => {
      if (t < vmin || t > vmax) return;
      const xPx = px(t);
      if (xPx - lastX < minPx) return;
      lastX = xPx;
      const x = new Date(t * 1000);
      shapes.push({
        type: 'line', x0: x, x1: x, y0: 0, y1: yTop,
        line: { color: s.color, width: BURN_W },
        opacity: BURN_A, layer: 'below',
      });
    });
  });
  let resets = p.resets.filter(r => r.t >= vmin && r.t <= vmax);
  if (days > 12) {
    const money = resets.filter(r => /\$/.test(String(r.pill || '') + String(r.tooltip || '')));
    resets = (money.length ? money : resets).slice(-8);
  }
  resets.forEach((r, i) => {
    if (r.t < vmin || r.t > vmax) return;
    const x = new Date(r.t * 1000);
    const pill = r.pill || r.label;
    const tip = String(r.tooltip || pill).replace(/%/g, '%%');
    shapes.push({
      type: 'line', x0: x, x1: x, y0: 0, y1: 1, yref: 'paper',
      line: { color: r.line_color, width: 1.8, dash: 'dash' },
    });
    annotations.push({
      x, y: 0.02 + (i % 4) * 0.07, yref: 'paper',
      text: pill, showarrow: false,
      font: { size: 10, color: r.edge },
      bgcolor: r.face, bordercolor: r.edge, borderwidth: 1, borderpad: 4,
      xanchor: 'left', yanchor: 'bottom',
    });
    traces.push({
      x: [x],
      y: [2 + (i % 4) * 7],
      mode: 'markers+text',
      text: [pill],
      textposition: 'middle right',
      textfont: { size: 11, color: 'rgba(0,0,0,0)' },
      marker: { size: 28, symbol: 'square', opacity: 0, color: r.face },
      name: pill,
      showlegend: false,
      hovertemplate: `${tip}<extra></extra>`,
      hoverlabel: { bgcolor: r.face, bordercolor: r.edge, font: { size: 12, color: r.edge } },
    });
  });
  if (tokenDays.length) traces.unshift({
    type: 'bar', name: 'Recorded tokens / day', showlegend: false, yaxis: 'y2',
    x: tokenDays.map(d => new Date((d.t + d.end) / 2 * 1000)),
    y: tokenDays.map(d => d.tokens || 0), width: tokenDays.map(d => (d.end - d.t) * 1000 * 0.96),
    customdata: tokenDays.map(d => d.date), marker: { color: '#8a8f98', opacity: 0.15 },
    hovertemplate: '%{customdata}<br>%{y:,.0f} recorded tokens<extra></extra>',
  });
  const xr = xRange();
  return {
    data: traces,
    layout: {
      title: { text: '', pad: { t: 0 } },
      autosize: false,
      width,
      height,
      margin: { t: 28, l: 48, r: 14, b: 44 },
      dragmode: false,
      yaxis: {
        title: { text: '% remaining', font: { size: 11 } },
        range: [-2, 102],
        fixedrange: true,
        showgrid: true, gridcolor: '#D6D6CE', gridwidth: 0.8, dtick: 20,
        minor: { showgrid: true, gridcolor: '#E8E8E2', gridwidth: 0.5, dtick: 5 },
        zeroline: false,
      },
      yaxis2: { overlaying: 'y', range: [0, tokenMax / 0.22], visible: false, fixedrange: true },
      xaxis: Object.assign({
        showgrid: true, gridcolor: '#A8A89C', gridwidth: 1.2,
        fixedrange: true,
        tickvals: axis.majors.map(t => new Date(t * 1000)),
        ticktext: axis.majors.map(t => axis.fmt(t)),
        minor: { showgrid: false },
      }, xr ? { range: xr } : {}),
      plot_bgcolor: '#FAFAF8', paper_bgcolor: '#fff',
      legend: { orientation: 'h', y: 1.12, font: { size: 10 } },
      shapes, annotations,
      hovermode: 'x unified',
    },
    config: { responsive: false, displayModeBar: false, scrollZoom: false, doubleClick: false },
  };
}

function bindZoom(div) {
  if (div._zoomBound) return;
  div._zoomBound = true;
  div.on('plotly_doubleclick', () => { range.snap(); });
}

// Plotly.react updates a drawn panel in place — a data refresh never blanks it.
function paintAll() {
  if (typeof Plotly === 'undefined') { showError('chart library did not load'); return; }
  const cols = currentCols();
  const h = panelHeight(cols);
  applyingLayout = true;
  range.markButtons();
  quotaUpdatePeriod(axisMinMax());
  plots.forEach(c => {
    if (!c.panel || c.kind === 'setup' || !c.div) return;
    updateQuotaHeader(c.section, c.panel, axisMinMax());
    quotaUpdateSpendStrip(c, c.div, axisMinMax());
    // measure AFTER CSS grid has applied --cols
    const w = Math.max(200, Math.floor(c.div.clientWidth || c.div.parentElement.clientWidth || grid.clientWidth));
    const fig = buildFigure(c.panel, w, h);
    if (c.div.data) {
      Plotly.react(c.div, fig.data, fig.layout, fig.config);
    } else {
      Plotly.newPlot(c.div, fig.data, fig.layout, fig.config);
      c.div.style.minHeight = '';
      c.section.classList.remove('loading');
    }
    bindZoom(c.div);
  });
  applyingLayout = false;
}

// Wait for grid reflow so clientWidth is full width at cols=1. rAF alone is
// not enough: it never fires while the tab is in the background, which would
// leave every panel blank until the tab is focused.
function afterReflow(fn) {
  let done = false;
  const run = () => { if (!done) { done = true; fn(); } };
  requestAnimationFrame(() => requestAnimationFrame(run));
  setTimeout(run, 120);
}

function preferredCols() { return layout.preferredCols(); }

function setCols(cols, persist) {
  if (cols != null && persist !== false) {
    layout.setCols(cols);
    return;
  }
  const want = preferredCols();
  const n = Math.max(1, plots.filter(c => c.kind !== 'setup').length || want);
  const applied = layout.columns(n, grid.clientWidth || window.innerWidth);
  document.documentElement.style.setProperty('--cols', String(applied));
  document.querySelectorAll('.controls button[data-cols]').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.cols) === want);
  });
  afterReflow(() => {
    const h = panelHeight(currentCols());
    plots.forEach(c => { if (c.div && !c.div.data) c.div.style.minHeight = h + 'px'; });
    paintAll();
    if (rangeNav) rangeNav.paint();
  });
}

// Skeleton panel painted before any data arrives: vendor name + reserved
// chart height, so the real chart lands without a layout jump.
function createPanel(vendor, i, kind) {
  const section = document.createElement('section');
  section.className = kind === 'setup' ? 'panel setup' : 'panel loading';
  section.style.setProperty('--i', String(i));
  const head = document.createElement('header');
  head.className = 'phead';
  head.innerHTML = `<div class="value-summary"><h2>${esc(vendor)}</h2><p class="value-line">&nbsp;</p><p class="usage-line">&nbsp;</p></div>`;
  section.append(head);
  const chart = { div: null, section, head, strip: null, panel: null, headSig: '', vendor, kind: kind || 'chart' };
  if (kind !== 'setup') {
    const div = document.createElement('div');
    div.className = 'chart';
    div.style.minHeight = panelHeight(currentCols()) + 'px';
    section.append(div);
    chart.div = div;
  }
  (kind === 'setup' ? document.getElementById('setup-grid') : grid).appendChild(section);
  return chart;
}

function fillSetup(c, p) {
  c.panel = p;
  const setup = p.setup || {};
  const html = `<div class="setup-body">
    <h2>${esc(p.vendor)}</h2>
    <p class="setup-status">This vendor is not configured</p>
    <p class="setup-copy">${esc(setup.body || 'Sign in, then collect a sample to plot remaining percent.')}</p>
    <button type="button" class="setup-action">Set it up</button>
  </div>`;
  if (c.head.innerHTML !== html) c.head.innerHTML = html;
  const btn = c.head.querySelector('.setup-action');
  if (btn) btn.onclick = () => openVendorSetup(p);
}

function fillPanel(c, p) {
  c.panel = p;
  // header markup only changes when the subscription state does; keeping it
  // preserves an open <details> across refreshes
  const headSig = [p.vendor, p.subscription.provider, p.subscription.monthly_usd == null, p.subscription.basis].join('|');
  if (c.headSig !== headSig) { c.head.innerHTML = quotaHeader(p); c.headSig = headSig; }

}

function fmtClock(sec) {
  const d = new Date(sec * 1000);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function markUpdated(data) {
  const el = document.getElementById('live');
  const sampled = Math.max(0, ...data.panels.map(p => p.sampled_at || 0));
  el.hidden = false;
  el.classList.remove('error');
  el.lastElementChild.textContent = sampled ? `live · data ${fmtClock(sampled)}` : 'live';
  if (el.dataset.ready) { el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); }
  else if (window.performance && performance.mark) performance.mark('quota-charts-ready'); // first paint with charts
  el.dataset.ready = '1';
}
function showError(msg) {
  const el = document.getElementById('live');
  el.hidden = false;
  el.classList.add('error');
  el.lastElementChild.textContent = msg;
}
function setCutoff(cutoff) {
  const info = document.querySelector('header .info');
  if (info && cutoff) info.title = `${info.dataset.title} · cutoff ${cutoff}`;
}

function syncVisible(panels) {
  const all = quotaOrderedPanels(panels);
  const configured = all.filter(isConfiguredPanel);
  const wanted = new Set(all.map(p => p.vendor));
  for (let i = plots.length - 1; i >= 0; i--) {
    if (wanted.has(plots[i].vendor)) continue;
    plots[i].section.remove();
    plots.splice(i, 1);
  }
  all.forEach((p, i) => {
    const kind = isConfiguredPanel(p) ? 'chart' : 'setup';
    let c = plots.find(ch => ch.vendor === p.vendor);
    if (c && c.kind !== kind) {
      c.section.remove();
      plots.splice(plots.indexOf(c), 1);
      c = null;
    }
    if (!c) {
      c = createPanel(p.vendor, i, kind);
      plots.push(c);
    }
    if (kind === 'setup') fillSetup(c, p);
    else fillPanel(c, p);
  });
  quotaOrderCharts(plots, all, grid);
  return configured;
}

function render(data) {
  window._quotaPanels = data.panels;
  const visible = syncVisible(data.panels);
  range.setBounds(boundsFromPanels(visible));
  setCutoff(data.cutoff);
  emptyEl.hidden = true;
  const rangeCtl = document.querySelector('.range-controls');
  if (rangeCtl) rangeCtl.hidden = visible.length === 0;
  rangeEl.hidden = visible.length === 0;
  if (!plots.length) {
    emptyEl.hidden = false;
    renderEmptyState(emptyEl, data.panels);
    markUpdated(data);
    return;
  }
  setCols(null, false);
  afterReflow(() => {
    paintAll();
    markUpdated(data);
    if (!rangeNav) {
      rangeNav = mountRangeNav(rangeEl, range, { night: false, getPanels: () => plots.map(c => c.panel).filter(p => p && isConfiguredPanel(p)) });
    } else {
      rangeNav.paint();
    }
  });
}

function boot() {
  const cols = preferredCols();
  document.documentElement.style.setProperty('--cols', String(cols));
  document.querySelectorAll('.controls button[data-cols]').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.cols) === cols);
    b.addEventListener('click', () => setCols(Number(b.dataset.cols), true));
  });
  document.querySelectorAll('.controls button[data-span]').forEach(b => {
    b.addEventListener('click', () => range.setSpan(Number(b.dataset.span)));
  });
  let spanFrame = 0;
  range.subscribe(() => {
    if (spanFrame) return;
    spanFrame = requestAnimationFrame(() => { spanFrame = 0; paintAll(); });
  });
  range.markButtons();
  let t = null;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => setCols(null, false), 100);
  });
  // Plotly is a deferred script: defined by DOMContentLoaded, after this inline
  // script has already painted the skeleton.
  const libReady = new Promise(resolve => {
    if (document.readyState !== 'loading') resolve();
    else document.addEventListener('DOMContentLoaded', () => resolve(), { once: true });
  });
  const poller = createLivePoller({
    fetchImpl: (url, init) => fetch(url, init),
    metaUrl: META_URL, dataUrl: DATA_URL, shellVersion: SHELL_VERSION,
    onData: data => { libReady.then(() => render(data)); },
    onOutdated: () => location.reload(),
    isBusy: () => !!document.querySelector('dialog[open]') || !!window.quotaSettingsPending,
    hidden: () => document.hidden,
  });
  window.quotaRefresh = () => poller.refresh();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poller.wake(); });
  poller.start().catch(err => showError(`data unavailable · ${err && err.message || err}`));
}
boot();
</script></body></html>
