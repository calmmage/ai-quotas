<!DOCTYPE html><html><head><meta charset="utf-8"/>
<title>Quota · Plotly</title>
<!-- this page is designed light; without this Chrome's auto-dark repaints the
     background dark and the SVG plot becomes invisible -->
<meta name="color-scheme" content="light">
<!-- static shell: data lives in ../panels.json (fetched, then refreshed in place).
     plotly-basic (scatter/bar/pie, ~1 MB) is enough for line traces + shapes; the
     full bundle is 4.5 MB. -->
<link rel="icon" href="data:,">
<link rel="preload" href="../__PANELS_NAME__" as="fetch" crossorigin>
<script defer src="https://cdn.plot.ly/plotly-basic-2.35.2.min.js"></script>
<style>
:root { --gap: 12px; --pad: 14px; }
* { box-sizing: border-box; }
body { margin:0; background:#fafaf8; color:#222; font-family:system-ui,sans-serif; }
header {
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
  gap:12px; padding:16px 18px 10px; border-bottom:1px solid #e5e5e0; background:#fff;
  position:sticky; top:0; z-index:5;
}
header h1 { font-size:16px; margin:0 0 2px; font-weight:650; }
header .info { display:inline-block; width:14px; height:14px; line-height:14px; margin-left:6px; border:1px solid #bbb; border-radius:50%; color:#888; font-size:10px; font-weight:600; text-align:center; vertical-align:2px; cursor:help; }
header .info:hover, header .info:focus { color:#222; border-color:#666; }
header .live { color:#777; }
.controls { display:flex; align-items:center; gap:8px; font-size:13px; }
.controls .range-note { color:#888; font-size:11px; font-weight:400; }
.controls label { color:#555; }
.controls button {
  min-width:2.2rem; height:2rem; border:1px solid #ccc; background:#fff; border-radius:6px;
  cursor:pointer; font:inherit; font-weight:600;
}
.controls button.active { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
.controls a.nav {
  display:inline-flex; align-items:center; height:2rem; padding:0 10px;
  border:1px solid #ccc; background:#fff; border-radius:6px;
  text-decoration:none; color:inherit; font-weight:600;
}
#grid {
  display:grid; gap:var(--gap); padding:var(--pad);
  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
}
.panel {
  background:#fff; border:1px solid #e5e5e0; border-radius:10px; overflow:hidden;
  display:flex; flex-direction:column; min-width:0;
}
.panel header.phead {
  position:static; border:0; background:transparent; padding:10px 12px 0;
  display:block;
}
.panel h2 { font-size:13px; margin:0 0 2px; font-weight:650; }
.panel .sub { margin:0 0 4px; color:#777; font-size:11px; }
.chart { width:100%; min-height:200px; }
.spend-strip {
  display:flex; align-items:flex-end; gap:2px; padding:0 12px 8px; height:36px;
}
.spend-strip span {
  flex:1; display:flex; align-items:flex-end; min-width:0; height:100%;
}
.spend-strip i {
  display:block; width:100%; background:#c9c4b8; border-radius:2px 2px 0 0;
  min-height:2px;
}
.spend-strip em { font-style:normal; color:#888; font-size:10px; padding:0 0 0 8px; align-self:flex-end; white-space:nowrap; }
/* Plotly defaults to ~700px; force fill of the grid cell */
.chart .js-plotly-plot, .chart .plot-container, .chart .svg-container {
  width:100% !important;
}
__PANEL_HEADER_CSS__
</style></head><body>
<header>
  <div>
    <h1>Quota remaining <span class="info" tabindex="0" data-title="All 4 vendors on one page · burn ticks + scheduled-reset budget guide on the primary window" title="All 4 vendors on one page · burn ticks + scheduled-reset budget guide on the primary window">i</span></h1>
    <p class="live" id="live" hidden><i></i><span>loading…</span></p>
  </div>
  <div class="controls">
    <label>range</label>
    <button type="button" data-span="7">1w</button>
    <button type="button" data-span="30">1m</button>
    <button type="button" data-span="90">1q</button>
    <button type="button" data-span="0" class="active span-active">all</button>
    <span class="range-note">drag/wheel zoom · snaps on the buttons</span>
    <label>plots / row</label>
    <button type="button" data-cols="1">1</button>
    <button type="button" data-cols="2" class="active">2</button>
    <button type="button" data-cols="3">3</button>
    <button type="button" data-cols="4">4</button>
    <label>mode</label>
    <button type="button" data-theme="day">day</button>
    <button type="button" data-theme="night">night</button>
  </div>
</header>
<div id="grid"></div>
<script>
__THEME_JS__
__PANEL_HEADER_JS__
__LIVE_REFRESH_JS__
__TIME_AXIS_JS__
function isDim(s) {
  return !!(s && (s.dim || /5h/i.test(s.label || '')));
}
function fmtTok(n) {
  if (n == null || !(n > 0)) return '';
  if (n >= 1e6) return `~${(n/1e6).toFixed(1)}M tok`;
  if (n >= 1e3) return `~${(n/1e3).toFixed(0)}k tok`;
  return `~${Math.round(n)} tok`;
}
function hoverExtra(s, y, index) {
  if (y == null) return '';
  const bits = [];
  const usd = s.point_usd ? s.point_usd[index] : s.window_usd;
  if (usd) bits.push(`estimated value $${(y/100*usd).toFixed(0)}`);
  if (s.tokens_per_pct) bits.push(fmtTok(y * s.tokens_per_pct));
  return bits.join(' · ');
}
function spendStrip(panel) {
  const rows = panel.spend || [];
  if (!rows.some(d => d.tokens)) return '';
  const max = Math.max(...rows.map(d => d.tokens || 0), 1);
  const bars = rows.map(d => {
    const h = 3 + 22 * ((d.tokens || 0) / max);
    const usd = d.cost_usd != null ? ` · $${Number(d.cost_usd).toFixed(2)}` : '';
    const title = `${d.day}: ${(d.tokens||0).toLocaleString()} tok${usd}`;
    return `<span title="${title}"><i style="height:${h}px"></i></span>`;
  }).join('');
  return `<div class="spend-strip">${bars}<em>daily tok</em></div>`;
}
function esc(s) {
  return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
const VENDORS = __VENDORS__;
const SHELL_VERSION = '__SHELL_VERSION__';
const DATA_URL = '../__PANELS_NAME__';
const META_URL = '../meta.json';
const BURN_W = __BURN_W__;
const BURN_A = __BURN_A__;
const grid = document.getElementById('grid');
const plots = []; // {div, section, head, strip, panel, headSig}
let spanDays = Number(localStorage.getItem('quota-plotly-span') || 0);

// latest timestamp across every series, so all panels share one window
let LAST_T = 0, FIRST_T = Infinity;
function setBounds(panels) {
  LAST_T = Math.max(0, ...panels.flatMap(p => p.series.map(s => s.t[s.t.length-1] || 0)));
  FIRST_T = Math.min(...panels.flatMap(p => p.series.filter(s => s.t.length).map(s => s.t[0])));
}
function viewMinMax() {
  if (!LAST_T || !isFinite(FIRST_T)) return [0, 1];
  const start = spanDays ? Math.max(FIRST_T, LAST_T - spanDays * 86400) : FIRST_T;
  return [start, Math.max(LAST_T, Date.now() / 1000) + 86400];
}
let customRange = null;
let applyingLayout = false;
function axisMinMax() {
  if (customRange && customRange.length === 2 && customRange[1] > customRange[0]) return customRange;
  return viewMinMax();
}
function visibleDays() {
  const [a, b] = axisMinMax();
  return (b - a) / 86400;
}
function markSpanCustom() {
  document.querySelectorAll('.controls button[data-span]').forEach(o => o.classList.remove('active'));
}
function markSpanSnap() {
  document.querySelectorAll('.controls button[data-span]').forEach(o =>
    o.classList.toggle('active', Number(o.dataset.span) === spanDays));
}
function xRange() {
  const [a, b] = axisMinMax();
  if (!isFinite(a) || !isFinite(b) || b <= a) return null;
  return [new Date(a * 1000), new Date(b * 1000)];
}

function currentCols() {
  return Number(getComputedStyle(document.documentElement).getPropertyValue('--cols')) || 2;
}

function panelHeight(cols) {
  const w = grid.clientWidth || window.innerWidth;
  const cell = Math.max(280, (w - 28 - (cols - 1) * 12) / cols);
  // taller when full-width (1 col)
  if (cols === 1) return Math.min(560, Math.max(380, cell * 0.32));
  if (cols === 2) return Math.min(420, Math.max(280, cell * 0.48));
  if (cols === 3) return Math.min(340, Math.max(240, cell * 0.55));
  return Math.min(280, Math.max(200, cell * 0.62));
}

function buildFigure(p, width, height) {
  const days = visibleDays();
  const traces = p.series.filter(s => !(isDim(s) && days > 10)).map(s => ({
    x: s.t.map(t => new Date(t * 1000)),
    y: s.y,
    mode: 'lines',
    name: s.label,
    opacity: isDim(s) ? 0.22 : 1,
    line: { color: s.color, width: isDim(s) ? 1.0 : 2.4 },
    connectgaps: false,
    text: s.y.map((y,i) => hoverExtra(s, y, i)),
    hovertemplate: `<b>${s.label}</b><br>%{x}<br>remaining %{y:.1f}%<br>%{text}<extra></extra>`,
  }));
  // Budget guide reaches zero at the provider-reported scheduled reset.
  p.budget.forEach(b => {
    b.segs.forEach((seg, i) => {
      traces.push({
        x: seg.map(pt => new Date(pt[0] * 1000)),
        y: seg.map(pt => pt[1]),
        mode: 'lines',
        name: b.label,
        showlegend: i === 0,
        legendgroup: 'budget',
        line: { color: '#8a8a8a', width: 1.4, dash: 'longdash' },
        hovertemplate: `<b>${b.label}</b><br>%{y:.1f}%<extra></extra>`,
      });
    });
  });
  const [vmin, vmax] = axisMinMax();
  const axis = timeAxis(vmin, vmax, width);
  const shapes = [];
  const annotations = [];
  const minPx = days > 20 ? 6 : 3;
  const px = t => (vmax === vmin) ? 0 : (t - vmin) / (vmax - vmin) * width;
  axis.minors.forEach(t => {
    shapes.push({
      type: 'line',
      x0: new Date(t * 1000), x1: new Date(t * 1000),
      y0: 0, y1: 1, yref: 'paper',
      line: { color: '#E8E8E2', width: 0.5 },
      layer: 'below',
    });
  });
  p.burn_ticks.forEach(s => {
    let lastX = -1e9;
    s.pts.forEach(([t, yTop]) => {
      if (t < vmin || t > vmax) return;
      const xPx = px(t);
      if (xPx - lastX < minPx) return;
      lastX = xPx;
      const x = new Date(t * 1000);
      shapes.push({
        type: 'line', x0: x, x1: x, y0: 0, y1: yTop,
        line: { color: s.color, width: BURN_W },
        opacity: BURN_A, layer: 'below',
      });
    });
  });
  let resets = p.resets.filter(r => r.t >= vmin && r.t <= vmax);
  if (days > 12) {
    const money = resets.filter(r => /\$/.test(String(r.pill || '') + String(r.tooltip || '')));
    resets = (money.length ? money : resets).slice(-8);
  }
  resets.forEach((r, i) => {
    if (r.t < vmin || r.t > vmax) return;
    const x = new Date(r.t * 1000);
    const pill = r.pill || r.label;
    const tip = String(r.tooltip || pill).replace(/%/g, '%%');
    shapes.push({
      type: 'line', x0: x, x1: x, y0: 0, y1: 1, yref: 'paper',
      line: { color: r.line_color, width: 1.8, dash: 'dash' },
    });
    annotations.push({
      x, y: 0.02 + (i % 4) * 0.07, yref: 'paper',
      text: pill, showarrow: false,
      font: { size: 10, color: r.edge },
      bgcolor: r.face, bordercolor: r.edge, borderwidth: 1, borderpad: 4,
      xanchor: 'left', yanchor: 'bottom',
    });
    traces.push({
      x: [x],
      y: [2 + (i % 4) * 7],
      mode: 'markers+text',
      text: [pill],
      textposition: 'middle right',
      textfont: { size: 11, color: 'rgba(0,0,0,0)' },
      marker: { size: 28, symbol: 'square', opacity: 0, color: r.face },
      name: pill,
      showlegend: false,
      hovertemplate: `${tip}<extra></extra>`,
      hoverlabel: { bgcolor: r.face, bordercolor: r.edge, font: { size: 12, color: r.edge } },
    });
  });
  const xr = xRange();
  return {
    data: traces,
    layout: {
      title: { text: '', pad: { t: 0 } },
      autosize: false,
      width,
      height,
      margin: { t: 28, l: 48, r: 14, b: 44 },
      dragmode: 'zoom',
      yaxis: {
        title: { text: '% remaining', font: { size: 11 } },
        range: [-2, 102],
        fixedrange: true,
        showgrid: true, gridcolor: '#D6D6CE', gridwidth: 0.8, dtick: 20,
        minor: { showgrid: true, gridcolor: '#E8E8E2', gridwidth: 0.5, dtick: 5 },
        zeroline: false,
      },
      xaxis: Object.assign({
        showgrid: true, gridcolor: '#A8A89C', gridwidth: 1.2,
        tickvals: axis.majors.map(t => new Date(t * 1000)),
        ticktext: axis.majors.map(t => axis.fmt(t)),
        minor: { showgrid: false },
      }, xr ? { range: xr } : {}),
      plot_bgcolor: '#FAFAF8', paper_bgcolor: '#fff',
      legend: { orientation: 'h', y: 1.12, font: { size: 10 } },
      shapes, annotations,
      hovermode: 'x unified',
    },
    config: { responsive: false, displayModeBar: false, scrollZoom: true, doubleClick: false },
  };
}

function bindZoom(div) {
  if (div._zoomBound) return;
  div._zoomBound = true;
  div.on('plotly_relayout', ev => {
    if (applyingLayout) return;
    const a = ev['xaxis.range[0]'], b = ev['xaxis.range[1]'];
    if (a == null || b == null) return;
    const min = +new Date(a) / 1000, max = +new Date(b) / 1000;
    if (!isFinite(min) || !isFinite(max) || max <= min) return;
    customRange = [min, max];
    markSpanCustom();
    paintAll();
  });
  div.on('plotly_doubleclick', () => {
    customRange = null;
    markSpanSnap();
    paintAll();
  });
}

// Plotly.react updates a drawn panel in place — a data refresh never blanks it.
function paintAll() {
  if (typeof Plotly === 'undefined') { showError('chart library did not load'); return; }
  const cols = currentCols();
  const h = panelHeight(cols);
  applyingLayout = true;
  plots.forEach(c => {
    if (!c.panel) return;
    updateQuotaHeader(c.section, c.panel, axisMinMax());
    // measure AFTER CSS grid has applied --cols
    const w = Math.max(200, Math.floor(c.div.clientWidth || c.div.parentElement.clientWidth || grid.clientWidth));
    const fig = buildFigure(c.panel, w, h);
    if (c.div.data) {
      Plotly.react(c.div, fig.data, fig.layout, fig.config);
    } else {
      Plotly.newPlot(c.div, fig.data, fig.layout, fig.config);
      c.div.style.minHeight = '';
      c.section.classList.remove('loading');
    }
    bindZoom(c.div);
  });
  applyingLayout = false;
}

// Wait for grid reflow so clientWidth is full width at cols=1. rAF alone is
// not enough: it never fires while the tab is in the background, which would
// leave every panel blank until the tab is focused.
function afterReflow(fn) {
  let done = false;
  const run = () => { if (!done) { done = true; fn(); } };
  requestAnimationFrame(() => requestAnimationFrame(run));
  setTimeout(run, 120);
}

function setCols(cols) {
  document.documentElement.style.setProperty('--cols', String(cols));
  document.querySelectorAll('.controls button[data-cols]').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.cols) === cols);
  });
  localStorage.setItem('quota-plotly-cols', String(cols));
  afterReflow(() => {
    const h = panelHeight(currentCols());
    plots.forEach(c => { if (!c.div.data) c.div.style.minHeight = h + 'px'; });
    paintAll();
  });
}

// Skeleton panel painted before any data arrives: vendor name + reserved
// chart height, so the real chart lands without a layout jump.
function createPanel(vendor, i) {
  const section = document.createElement('section');
  section.className = 'panel loading';
  section.style.setProperty('--i', String(i));
  const head = document.createElement('header');
  head.className = 'phead';
  head.innerHTML = `<div class="value-summary"><h2>${esc(vendor)}</h2><p class="value-line">&nbsp;</p><p class="period-line">&nbsp;</p></div>`;
  const div = document.createElement('div');
  div.className = 'chart';
  div.style.minHeight = panelHeight(currentCols()) + 'px';
  section.append(head, div);
  grid.appendChild(section);
  return { div, section, head, strip: null, panel: null, headSig: '' };
}

function fillPanel(c, p) {
  c.panel = p;
  // header markup only changes when the subscription state does; keeping it
  // preserves an open <details> across refreshes
  const headSig = [p.vendor, p.subscription.provider, p.subscription.monthly_usd == null, p.subscription.basis].join('|');
  if (c.headSig !== headSig) { c.head.innerHTML = quotaHeader(p); c.headSig = headSig; }
  const stripHtml = spendStrip(p);
  if (c.strip) { c.strip.remove(); c.strip = null; }
  if (stripHtml) {
    const holder = document.createElement('div');
    holder.innerHTML = stripHtml;
    c.strip = holder.firstElementChild;
    c.section.insertBefore(c.strip, c.div);
  }
}

function fmtClock(sec) {
  const d = new Date(sec * 1000);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function markUpdated(data) {
  const el = document.getElementById('live');
  const sampled = Math.max(0, ...data.panels.map(p => p.sampled_at || 0));
  el.hidden = false;
  el.classList.remove('error');
  el.lastElementChild.textContent = sampled ? `live · data ${fmtClock(sampled)}` : 'live';
  if (el.dataset.ready) { el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); }
  else if (window.performance && performance.mark) performance.mark('quota-charts-ready'); // first paint with charts
  el.dataset.ready = '1';
}
function showError(msg) {
  const el = document.getElementById('live');
  el.hidden = false;
  el.classList.add('error');
  el.lastElementChild.textContent = msg;
}
function setCutoff(cutoff) {
  const info = document.querySelector('header .info');
  if (info && cutoff) info.title = `${info.dataset.title} · cutoff ${cutoff}`;
}

function render(data) {
  setBounds(data.panels);
  setCutoff(data.cutoff);
  data.panels.forEach((p, i) => {
    if (!plots[i]) plots[i] = createPanel(p.vendor, i);
    fillPanel(plots[i], p);
  });
  afterReflow(() => { paintAll(); markUpdated(data); });
}

function boot() {
  const saved = Number(localStorage.getItem('quota-plotly-cols') || 2);
  const cols = [1,2,3,4].includes(saved) ? saved : 2;
  document.documentElement.style.setProperty('--cols', String(cols));
  VENDORS.forEach((v, i) => { plots[i] = createPanel(v, i); });
  document.querySelectorAll('.controls button[data-cols]').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.cols) === cols);
    b.addEventListener('click', () => setCols(Number(b.dataset.cols)));
  });
  document.querySelectorAll('.controls button[data-span]').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.span) === spanDays);
    b.addEventListener('click', () => {
      spanDays = Number(b.dataset.span);
      customRange = null;
      localStorage.setItem('quota-plotly-span', String(spanDays));
      markSpanSnap();
      paintAll();
    });
  });
  let t = null;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(paintAll, 100);
  });
  // Plotly is a deferred script: defined by DOMContentLoaded, after this inline
  // script has already painted the skeleton.
  const libReady = new Promise(resolve => {
    if (document.readyState !== 'loading') resolve();
    else document.addEventListener('DOMContentLoaded', () => resolve(), { once: true });
  });
  const poller = createLivePoller({
    fetchImpl: (url, init) => fetch(url, init),
    metaUrl: META_URL, dataUrl: DATA_URL, shellVersion: SHELL_VERSION,
    onData: data => { libReady.then(() => render(data)); },
    onOutdated: () => location.reload(),
    isBusy: () => !!document.querySelector('dialog[open]') || !!window.quotaSettingsPending,
    hidden: () => document.hidden,
  });
  window.quotaRefresh = () => poller.refresh();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poller.wake(); });
  poller.start().catch(err => showError(`data unavailable · ${err && err.message || err}`));
}
boot();
</script></body></html>
